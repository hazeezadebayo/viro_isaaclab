services:
  isaac-sim:
    image: isaac-rl-studio:2.1.0-humble
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nvcr.io/nvidia/isaac-lab:2.1.0}
        ROS_DISTRO: humble
    container_name: ${CONTAINER_NAME:-isaac-rl-studio}
    network_mode: ${NETWORK_MODE:-host}
    runtime: nvidia
    environment:
      - ACCEPT_EULA=${ACCEPT_EULA:-Y}
      - PRIVACY_CONSENT=${PRIVACY_CONSENT:-Y}
      - OMNI_KIT_ALLOW_ROOT=${OMNI_KIT_ALLOW_ROOT:-1}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-all}
      - HEAD_NAME=${HEAD_NAME:-template}
      - NO_GUI=${NO_GUI:-0}
      - ROS_DISTRO=${ROS_DISTRO:-humble}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - ../core:/workspace/core:ro
      - ../core/source/${HEAD_NAME:-template}:/workspace/head:ro
      - ../workspace/logs:/workspace/logs
      - ../workspace/data:/workspace/data
      - isaac-kit-cache:/isaac-sim/kit/cache
      - isaac-ov-cache:/root/.cache/ov
      - isaac-pip-cache:/root/.cache/pip
      - isaac-gl-cache:/root/.cache/nvidia/GLCache
      - isaac-compute-cache:/root/.nv/ComputeCache
      - isaac-omni-logs:/root/.nvidia-omniverse/logs
      - isaac-local-data:/root/.local/share/ov/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: /usr/local/bin/isaac-ros-entrypoint.sh
    command: sleep infinity
    restart: unless-stopped

  isaac-viz:
    image: isaac-rl-studio-viz:2.1.0-humble
    build:
      context: ..
      dockerfile: docker/Dockerfile.viz
      args:
        VIZ_BASE: isaac-rl-studio:2.1.0-humble
    container_name: ${VIZ_CONTAINER_NAME:-isaac-rl-studio-viz}
    ports:
      - "${VIZ_PORT:-6080}:6080"
      - "${VNC_PORT:-5900}:5900"
      - "${TENSORBOARD_PORT:-6006}:6006"
    runtime: nvidia
    environment:
      - ACCEPT_EULA=${ACCEPT_EULA:-Y}
      - PRIVACY_CONSENT=${PRIVACY_CONSENT:-Y}
      - OMNI_KIT_ALLOW_ROOT=${OMNI_KIT_ALLOW_ROOT:-1}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-all}
      - HEAD_NAME=${HEAD_NAME:-template}
      - NO_GUI=0
      - DISPLAY=:99
      - VIZ_PORT=${VIZ_PORT:-6080}
      - VNC_PORT=${VNC_PORT:-5900}
      - VIZ_TASK=${VIZ_TASK:-}
      - VIZ_NUM_ENVS=${VIZ_NUM_ENVS:-4}
      - VIZ_MAX_ITERATIONS=${VIZ_MAX_ITERATIONS:-100000}
      - VIZ_VIDEO=${VIZ_VIDEO:-0}
      - VIZ_VIDEO_INTERVAL=${VIZ_VIDEO_INTERVAL:-2000}
      - VIZ_VIDEO_LENGTH=${VIZ_VIDEO_LENGTH:-2000}
      - TENSORBOARD_PORT=${TENSORBOARD_PORT:-6006}
      - ROS_DISTRO=${ROS_DISTRO:-humble}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - ../core:/workspace/core:ro
      - ../core/source/${HEAD_NAME:-template}:/workspace/head:ro
      - ../workspace/logs:/workspace/logs
      - ../workspace/data:/workspace/data
      - isaac-kit-cache:/isaac-sim/kit/cache
      - isaac-ov-cache:/root/.cache/ov
      - isaac-pip-cache:/root/.cache/pip
      - isaac-gl-cache:/root/.cache/nvidia/GLCache
      - isaac-compute-cache:/root/.nv/ComputeCache
      - isaac-omni-logs:/root/.nvidia-omniverse/logs
      - isaac-local-data:/root/.local/share/ov/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: /usr/local/bin/isaac-ros-entrypoint.sh
    command: sleep infinity
    restart: unless-stopped

volumes:
  isaac-kit-cache:
  isaac-ov-cache:
  isaac-pip-cache:
  isaac-gl-cache:
  isaac-compute-cache:
  isaac-omni-logs:
  isaac-local-data:
