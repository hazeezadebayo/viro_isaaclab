services:
  isaac-sim:
    image: isaac-rl-studio:2.1.0-humble
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nvcr.io/nvidia/isaac-lab:2.1.0}
        ROS_DISTRO: humble
    container_name: ${CONTAINER_NAME:-isaac-rl-studio}
    network_mode: ${NETWORK_MODE:-host}
    runtime: nvidia
    environment:
      - ACCEPT_EULA=${ACCEPT_EULA:-Y}
      - PRIVACY_CONSENT=${PRIVACY_CONSENT:-Y}
      - OMNI_KIT_ALLOW_ROOT=${OMNI_KIT_ALLOW_ROOT:-1}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-all}
      - HEAD_NAME=${HEAD_NAME:-humanoid}
      - NO_GUI=${NO_GUI:-1}
      - ROS_DISTRO=${ROS_DISTRO:-humble}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - ../core:/workspace/core:ro
      # Writable exceptions to read-only core mount: core/data and core/logs. Must appear AFTER the read-only parent mount.
      - ../core/data:/workspace/core/data
      - ../core/logs:/workspace/core/logs
      - ../core/logs:/workspace/logs
      - ../third_party:/workspace/third_party:ro
      - ../core/source/${HEAD_NAME:-humanoid}:/workspace/head:ro
      - isaac-kit-cache:/isaac-sim/kit/cache
      - isaac-ov-cache:/root/.cache/ov
      - isaac-pip-cache:/root/.cache/pip
      - isaac-gl-cache:/root/.cache/nvidia/GLCache
      - isaac-compute-cache:/root/.nv/ComputeCache
      - isaac-omni-logs:/root/.nvidia-omniverse/logs
      - isaac-local-data:/root/.local/share/ov/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: /usr/local/bin/isaac-ros-entrypoint.sh
    command: sleep infinity
    restart: unless-stopped

  tensorboard:
    image: isaac-rl-studio:2.1.0-humble
    container_name: ${TB_CONTAINER_NAME:-isaac-tensorboard}
    network_mode: ${NETWORK_MODE:-host}
    volumes:
      - ../core/logs:/workspace/core/logs
      - ../core/logs:/workspace/logs
    entrypoint: /usr/local/bin/isaac-ros-entrypoint.sh
    command: ["python", "-m", "tensorboard.main", "--logdir", "/workspace/core/logs", "--port", "6006", "--bind_all"]
    restart: unless-stopped

volumes:
  isaac-kit-cache:
  isaac-ov-cache:
  isaac-pip-cache:
  isaac-gl-cache:
  isaac-compute-cache:
  isaac-omni-logs:
  isaac-local-data:
