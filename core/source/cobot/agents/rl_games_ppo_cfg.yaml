params:
  seed: 42
  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
    mlp:
      units: [256, 128, 64]
      activation: elu
      initializer:
        name: default

  config:
    name: cobot_reaching
    horizon_length: 24
    minibatch_size: 2048
    mini_epochs: 5
    critic_coef: 1.0
    clip_value: True
    seq_len: 4
    bounds_loss_coef: 0.0001
